<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地図で覚える都道府県・世界の国</title>
<meta name="description" content="実際の境界線の地図で、都道府県と世界の国の位置を覚えるクイズ">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="地図">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#23262b; --sub:#5d6470; --line:#d9d5cc;
  --sea:#dcebf5; --lake:#a9cde9; --land:#f3ecdc; --out:#e4e2dd; --outink:#7a7f88;
  --accent:#d9822b; --accent-soft:#f6d7b4; --sel:#4a8fd8; --sel-soft:#bcd8f5;
  --ok:#3f9d5a; --ok-soft:#bfe5c8; --ng:#d2554d; --ng-soft:#f4c4bf; --nb:#f3e3a6; --passed:#cfe7d4;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.jp{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:14px;min-height:34px}
#status{font-size:13px;color:var(--sub);padding:6px 12px 0;display:flex;flex-wrap:wrap;gap:4px 10px}
#status .tag{background:var(--accent-soft);color:#7a3f00;border-radius:999px;padding:0 8px}
#status .tag.spot{background:#e2d6f3;color:#4b2a7a}
#prompt{padding:6px 12px 8px;font-size:18px;font-weight:600;min-height:34px}
#prompt .small{display:block;font-size:13px;font-weight:400;color:var(--sub)}
#mapwrap{position:relative;background:var(--sea);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;height:min(52vh,460px);min-height:240px}
body.session #app{height:100dvh;min-height:0}
body.session #mapwrap{flex:1 1 auto;height:auto}
body.session #panel{max-height:52dvh;overflow:auto}
.zoomctl button{width:38px;height:38px}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pref path{fill:var(--land);stroke:#7d7563;stroke-width:.9px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pref.out path{fill:var(--out);stroke:#a8a59e}
.pref.passed path{fill:var(--passed)}
.pref.focusreg path{fill:#fbe9c9}
.pref.hl path{fill:var(--accent)}
.pref.nb path{fill:var(--nb)}
.pref.sel path{fill:var(--sel-soft);stroke:var(--sel);stroke-width:2.2px}
.pref.ans path{fill:#e6eef8}
.pref.ok path{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2px}
.pref.ng path{fill:var(--ng-soft);stroke:var(--ng);stroke-width:2px}
.pref.na path{fill:#ececec;stroke:#999;stroke-width:1.6px;stroke-dasharray:4 3}
.lake{fill:var(--lake);pointer-events:none}
.pref circle.hit{fill:transparent;stroke:none;pointer-events:all}
.bgc{fill:#ebe9e4;stroke:#b8b4ab;stroke-width:.6px;vector-effect:non-scaling-stroke;pointer-events:none}
.marks circle{fill:none;stroke:var(--accent);pointer-events:none}
.marks circle.sel{stroke:var(--sel)} .marks circle.ok{stroke:var(--ok)} .marks circle.ng{stroke:var(--ng)} .marks circle.nb{stroke:#c9a227}
.dstabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dstabs button{border:0;background:#fff;padding:4px 12px;font-size:14px;min-height:34px}
.dstabs button.on{background:var(--accent);color:#fff;font-weight:700}
.labels text,.seas text,.insetg text{paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.labels text{fill:#2c2f35;font-weight:600}
.labels text.outl{fill:var(--outink);font-weight:500}
.labels text.ansl{fill:#1f5fa8}
.labels text.q{fill:#9a8f78}
.labels text.okl{fill:#1f6b35}
.labels text.ngl{fill:#a3302a}
.seas text{fill:#5f87a8;font-style:italic;stroke:none}
.lms text{fill:#6b5232;font-weight:600;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.lms circle{fill:#6b5232;pointer-events:none}
.resume{border:2px solid var(--sel);background:#f1f7fe}
.insetg rect{fill:none;stroke:#6b8aa5;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;stroke-width:1.2px}
.insetg text{fill:#4f6d87;stroke:none}
.zoomctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomctl button{width:40px;height:40px;border-radius:10px;border:1px solid #b9c7d3;background:rgba(255,255,255,.92);font-size:20px;line-height:1;padding:0}
.zoomctl button.fit{font-size:12px}
.credit{position:absolute;left:6px;bottom:4px;font-size:10px;color:#4f6378;background:rgba(255,255,255,.75);padding:0 5px;border-radius:4px;pointer-events:none;max-width:calc(100% - 12px)}
#panel{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--card)}
body.home #panel{background:transparent}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:46px;padding:8px 10px;font-size:16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.blue{background:var(--sel);border-color:var(--sel);color:#fff}
.btn.ghost{background:transparent;font-weight:500;color:var(--sub)}
.btn:disabled{opacity:.45;cursor:default}
.btn.right{background:var(--ok-soft);border-color:var(--ok)}
.btn.wrong{background:var(--ng-soft);border-color:var(--ng)}
.row{display:flex;gap:8px;margin-top:8px}
.row>.btn{flex:1}
.feedback{font-size:15px;margin:6px 0 2px;min-height:24px}
.feedback .ok{color:var(--ok);font-weight:700}
.feedback .ng{color:var(--ng);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #9fb9d6;background:#fff;border-radius:999px;padding:6px 12px;font-size:15px;min-height:40px;font-weight:600}
.chip.used{background:#e6eef8;color:#5a7393;border-style:dashed}
.chip:disabled{opacity:.4}
.hint{background:#fff8e6;border:1px solid #efd99a;border-radius:10px;padding:8px 10px;font-size:15px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 8px}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.reg{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;text-align:left;min-height:64px}
.reg .nm{font-weight:700;font-size:16px}
.reg .st{font-size:13px;color:var(--sub)}
.reg.passed{background:#eef8f0;border-color:#9fd0ab}
.reg.next{border:2px solid var(--accent);background:#fff7ee}
.muted{color:var(--sub);font-size:13px}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini td,table.mini th{padding:4px 4px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
table.mini th{font-weight:600;color:var(--sub);font-size:12px}
table.mini td.n{text-align:right;white-space:nowrap}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;font-size:15px;min-height:36px}
.checks input{width:20px;height:20px}
select{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;min-height:36px}
.warn{background:#fff1f0;border:1px solid #f0b8b3;border-radius:10px;padding:8px 10px;font-size:14px}
footer{padding:12px;font-size:12px;color:var(--sub)}
footer a{color:#3d6f9e}
.modalbg{position:fixed;inset:0;background:rgba(20,24,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;padding:16px;max-width:420px;width:100%}
.modal p{margin:0 0 12px}
.result-table td.n{font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:700}
.hidden{display:none!important}
.nw{white-space:nowrap}
@media (min-width:760px){
  body.session #mainrow{display:flex;flex-direction:row;flex:1;min-height:0}
  body.session #mapcol{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
  body.session #panel{max-height:none;width:340px;flex:0 0 340px;border-left:1px solid var(--line);overflow:auto}
}
#mainrow,#mapcol{display:flex;flex-direction:column;flex:1;min-height:0}
body.home #mainrow,body.home #mapcol{flex:0 0 auto}
</style>
</head>

      </div>
    </div>
    <div id="panel"></div>
  </div>

</div>

/* タップした県を探す（海の上をタップしたときは、すぐ近くの県を1つだけ拾う） */
function prefAt(cx, cy) {
  const hit = document.elementFromPoint(cx, cy);
  const g = hit && hit.closest && hit.closest(".pref");
  if (g) return g.dataset.id;

  for (const rad of [6, 11]) {
    for (let a = 0; a < 8; a++) {
      const h = document.elementFromPoint(cx + Math.cos(a * Math.PI / 4) * rad, cy + Math.sin(a * Math.PI / 4) * rad);

function resumeSession(c) {
  S = c;
  setMode("session");
  panel.innerHTML = "";
  fitTo(isDrill() ? DATA_BOX : regionBox(S.region));
  if (S.phase === "test") { S.testRound--; return startTest(); }
  if (S.answered === S.idx) S.idx++;
  nextQ();
}
/* ===== 学習セッション ===== */
let S = null;
function startRegion(rid) {
  const reg = REGION[rid];
  S = { region: rid, phase: "check", queue: shuffle(reg.items.slice()).map(id => ({ id, type: "check" })), idx: 0,
        missed: [], counts: { check: zc(), locate: zc(), spot: zc(), review: zc(), test: zc() }, testRound: 0, answered: -1 };
  setMode("session");
  panel.innerHTML = "";
  fitTo(regionBox(rid));
  nextQ();
}
const isDrill = () => S && S.mode === "drill";
function sessionTag() { return isDrill() ? S.title : REGION[S.region].name; }
function nationalView() {
  view = { focusRegion: null, hidden: new Set(DS.items.map(i => i.id)), cls: {}, labelText: {}, labelCls: {}, forceLabel: new Set(), home: false, lm: new Set() };
}
let DATA_BOX = [0, 0, 1, 1];
// 表示範囲が狭すぎるとき（小さな島国など）は、周りが見える広さまで広げる
function atLeast(b, size) {
  const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, hw = Math.max(b[2] - b[0], size) / 2, hh = Math.max(b[3] - b[1], size) / 2;
  return [cx - hw, cy - hh, cx + hw, cy + hh];
}
function boxAround(id, minSize) {
  const b = insetOf(id) ? boundsOf([id], true) : ITEM[id].b;
  const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, h = Math.max(b[2] - b[0], b[3] - b[1], minSize) * 0.85;
  return [cx - h, cy - h, cx + h, cy + h];
}
function baseView(rid, extraHidden) {
  const hidden = new Set(REGION[rid].items);
  (extraHidden || []).forEach(i => hidden.add(i));
  view = { focusRegion: rid, hidden, cls: {}, labelText: {}, labelCls: {}, forceLabel: new Set(), home: false, lm: new Set() };
}
function statusLine() {
  const ph = S.phase;
  const c = S.counts[ph === "locate" ? "locate" : ph] || zc();
  const total = S.queue.length;
  const q = S.queue[S.idx];
  let tags = `<span class="tag">${esc(sessionTag())}</span><span>${PHASE_NAMES[ph] || ""} ${Math.min(S.idx + 1, total)}/${total}</span>`;
  if (q && q.spot) tags += `<span class="tag spot">抜き打ち（合格済みの地方から）</span>`;
  if (ph !== "test") tags += `<span>正解 ${c.correct}・不正解 ${c.wrong}・未回答 ${c.unanswered}</span>`;
  setStatus(tags);
}
function record(phaseKey, id, kind) { const c = S.counts[phaseKey]; c.asked++; c[kind]++; bumpStat(id, kind); S.answered = S.idx; save(); saveCurrent(); }
function nextQ() {
  if (S.idx >= S.queue.length) return endPhase();
  saveCurrent();
  const q = S.queue[S.idx];
  statusLine();
  if (q.type === "check") askCheck(q);
  else if (q.type === "locate") askLocate(q);
  else if (q.type === "reviewcard") showReviewCard(q);
  else if (q.type === "adj") askAdj(q);
}
function advance() { S.idx++; nextQ(); }
function endPhase() {
  if (isDrill()) {
    if (S.phase === "drill") return startDrillReview();
    return finishDrill();
  }
  if (S.phase === "check") {
    S.phase = "locate";
    const own = shuffle(REGION[S.region].items.slice()).map(id => ({ id, type: "locate" }));
    const spots = pickSpot().map(id => ({ id, type: "locate", spot: true }));
    for (const s of spots) own.splice(Math.floor(Math.random() * (own.length + 1)), 0, s);
    S.queue = own; S.idx = 0;
    return interstitial("位置問題", "県名が出ます。地図でその県をタップし、「この県で回答」を押してください。" + (S.queue.some(q => q.spot) ? "合格済みの地方からの抜き打ち問題も入ります。" : ""), nextQ);
  }
  if (S.phase === "locate" || (S.phase === "review" && false)) {
    return startReview(S.missed, "test");
  }
  if (S.phase === "review") return startTest();
  if (S.phase === "test") return;
}
function interstitial(title, text, go) {
  onMapTap = null;
  setStatus(`<span class="tag">${esc(sessionTag())}</span>`);
  setPrompt(esc(title));
  panel.innerHTML = `<p class="jp">${esc(text)}</p><div class="row"><button class="btn primary" id="goBtn">始める</button></div>`;
  $("#goBtn").onclick = go;
}
function pickSpot() {
  const n = REC.settings.spot || 0;
  const pool = DS.items.filter(it => it.region !== S.region && REC.passed[it.region]);
  const out = [];
  const w = pool.map(it => { const s = REC.stats[it.id]; return 1 + (s && s.asked ? 4 * (s.wrong + s.unanswered) / s.asked : 0); });
  while (out.length < n && pool.length) {
    const tot = w.reduce((a, b) => a + b, 0); let r = Math.random() * tot, i = 0;
    for (; i < w.length - 1; i++) { r -= w[i]; if (r <= 0) break; }
    out.push(pool[i].id); pool.splice(i, 1); w.splice(i, 1);
  }
  return out;
}
function addMissed(id) { if (!S.missed.includes(id)) S.missed.push(id); }

/* 確認問題：色のついた県の名前を選ぶ */
function askCheck(q) {
  const it = ITEM[q.id];
  if (isDrill()) { nationalView(); view.cls[q.id] = "hl"; render(); fitTo(boxAround(q.id, U.boxMin), 0); }
  else {
    baseView(S.region);
    view.cls[q.id] = "hl";
    render();
    const b = it.b; const inView = b[0] >= cam.x && b[2] <= cam.x + cam.w && b[1] >= cam.y && b[3] <= cam.y + cam.h;
    if (!inView) fitTo(regionBox(S.region));
  }
  setPrompt(`色のついた県はどこ？<span class="small">選択肢から県名を選んでください</span>`);
  const regItems = isDrill() ? DS.items.map(i => i.id).filter(i => i !== q.id).sort((a, b) => dist(a, q.id) - dist(b, q.id)).slice(0, 5) : REGION[S.region].items.filter(i => i !== q.id);
  let cand = shuffle([...new Set(regItems.concat(it.nb))].filter(i => i !== q.id));
  const nbFirst = shuffle(it.nb.filter(i => regItems.includes(i)));
  let pick = [...new Set(nbFirst.concat(cand))].slice(0, 3);
  if (pick.length < 3) { const more = shuffle(DS.items.map(i => i.id).filter(i => i !== q.id && !pick.includes(i))).sort((a, b) => dist(a, q.id) - dist(b, q.id)); pick = pick.concat(more.slice(0, 3 - pick.length)); }
  const opts = shuffle(pick.concat(q.id));
  panel.innerHTML = `<div class="choices">${opts.map(o => `<button class="btn" data-o="${o}">${esc(ITEM[o].name)}</button>`).join("")}</div>
   <div class="feedback" id="fb"></div>
   <div class="row"><button class="btn ghost" id="skipBtn">わからない</button><button class="btn primary hidden" id="nextBtn">次へ</button></div>`;
  onMapTap = null;
  const finish = (chosen) => {
    panel.querySelectorAll("[data-o]").forEach(b => { b.disabled = true; if (b.dataset.o === q.id) b.classList.add("right"); else if (b.dataset.o === chosen) b.classList.add("wrong"); });
    const kind = chosen == null ? "unanswered" : chosen === q.id ? "correct" : "wrong";
    record(isDrill() ? "drill" : "check", q.id, kind);
    if (kind !== "correct") addMissed(q.id);
    view.cls[q.id] = kind === "correct" ? "ok" : "ng"; view.forceLabel.add(q.id); view.labelCls[q.id] = kind === "correct" ? "okl" : "ngl"; view.lm.add(q.id); render();
    saveCurrent();
    $("#fb").innerHTML = kind === "correct" ? `<span class="ok">正解</span>　${esc(it.name)}` : `<span class="ng">${kind === "wrong" ? "不正解" : "未回答"}</span>　正しくは${esc(it.name)}`;
    $("#skipBtn").classList.add("hidden");
    const nb = $("#nextBtn"); nb.classList.remove("hidden"); nb.onclick = advance;
    statusLine();
    if (kind === "correct") { const my = S.idx; setTimeout(() => { if (S && S.idx === my && S.queue[my] === q) advance(); }, 900); }
  };
  panel.querySelectorAll("[data-o]").forEach(b => b.onclick = () => finish(b.dataset.o));
  $("#skipBtn").onclick = () => finish(null);
}
function dist(a, b) { const A = ITEM[a], B = ITEM[b]; return Math.hypot(A.lx - B.lx, A.ly - B.ly); }

/* 位置問題：県名を見て地図でタップ */
function askLocate(q) {
  const it = ITEM[q.id];
  const rid = it.region;
  if (isDrill()) {
    nationalView(); render();
    if (q.refit || fitBox.join() !== DATA_BOX.join()) fitTo(DATA_BOX, 0.02);
  } else {
  baseView(rid, REGION[S.region].items);
  if (q.spot) view.focusRegion = null;
  render();
  }
  if (isDrill()) {}
  else if (q.spot) { const b = regionBox(rid), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, hw = Math.max(b[2] - b[0], 260) * 0.9, hh = Math.max(b[3] - b[1], 260) * 0.9; fitTo([cx - hw, cy - hh, cx + hw, cy + hh], 0); }
  else if (q.refit) fitTo(regionBox(rid));
  else if (fitBox && regionBox(rid).join() !== fitBox.join()) fitTo(regionBox(rid));
  setPrompt(`「${esc(it.name)}」はどこ？<span class="small">${isDrill() ? "小さく見える県は、タップすると拡大します。" : ""}地図でタップして選び、もう一度タップするか「この県で回答」で決定</span>`);
  panel.innerHTML = `<div class="feedback" id="fb">まだ選んでいません</div>
   <div class="row"><button class="btn ghost" id="skipBtn">わからない</button><button class="btn blue" id="ansBtn" disabled>この県で回答</button><button class="btn primary hidden" id="nextBtn">次へ</button></div>`;
  let sel = null, done = false;

    if (cx != null && tinyOnScreen(id)) { zoomAt(1 / 3, cx, cy); $("#fb").textContent = "拡大しました。もう一度タップして選んでください"; return; } // 小さい県は先に拡大する
    if (sel) delete view.cls[sel];

    if (kind === "wrong") { view.cls[chosen] = "ng"; view.forceLabel.add(chosen); view.labelCls[chosen] = "ngl"; }
    view.lm.add(q.id);
    render();
    let msg;
    if (kind === "correct") msg = `<span class="ok">正解</span>　${esc(it.name)}`;
    else if (kind === "wrong") msg = `<span class="ng">不正解</span>　選んだのは${esc(ITEM[chosen].name)}。${esc(it.name)}はオレンジの県です`;
    else msg = `<span class="ng">未回答</span>　${esc(it.name)}はオレンジの県です`;
    $("#fb").innerHTML = msg;
    $("#ansBtn").classList.add("hidden"); $("#skipBtn").classList.add("hidden");

/* 復習：隣接県と目印を見せてから、もう一度出題 */
function startReview(ids, then) {
  S.phase = "review"; S.idx = 0; S.stillWrong = new Set(ids);
  S.queue = ids.map(id => ({ id, type: "reviewcard", tries: 0 }));

  if (!ids.length) { return interstitial("復習", "間違えた県はありませんでした。白地図テストに進みます。", startTest); }
  interstitial("間違えた県の復習", `${ids.length}県を復習します。隣の県と目印を見てから、もう一度位置を答えます。`, nextQ);

function neighborText(it) {

  return "陸で接する：" + it.nb.map(n => { const key = [it.id, n].sort().join("-"); const note = DS.neighborNotes[key]; return ITEM[n].name + (note ? `（${note}）` : ""); }).join("、");
}
function showReviewCard(q) {
  const it = ITEM[q.id];

  view.cls[q.id] = "hl"; view.forceLabel.add(q.id);

  view.lm.add(q.id); it.nb.forEach(n => view.lm.add(n));
  render();
  const ids = [q.id].concat(it.nb);
  fitTo(atLeast(boundsOf(ids, !!insetOf(q.id)), U.boxMin * 1.4), 0.15);
  setPrompt(`${esc(it.name)}を復習<span class="small">オレンジが${esc(it.name)}、黄色が陸で接する県です${q.kind === "adj" ? "。このあと隣接県をもう一度答えます" : ""}</span>`);
  panel.innerHTML = `<p class="jp" style="margin:4px 0">${esc(neighborText(it))}</p><div class="hint jp">目印：${esc(it.hint)}</div>
   <div class="row"><button class="btn primary" id="againBtn">覚えた。もう一度出題</button></div>`;
  onMapTap = null;
  $("#againBtn").onclick = () => { S.queue.splice(S.idx + 1, 0, { id: q.id, type: q.kind === "adj" ? "adj" : "locate", refit: true, tries: q.tries }); advance(); };
}

/* 白地図テスト：その地方の全部の県に名前を入れる */
function startTest() {
  S.phase = "test"; S.testRound++; saveCurrent();
  const rid = S.region;
  const reg = REGION[rid];
  const ans = {}; let sel = null;
  S.queue = []; S.idx = 0;
  setStatus(`<span class="tag">${esc(reg.name)}</span><span>白地図テスト${S.testRound > 1 ? "（" + S.testRound + "回目）" : ""}</span>`);
  setPrompt(`白地図テスト<span class="small">県をタップしてから、下の県名を選んでください。全問正解で合格です</span>`);
  fitTo(regionBox(rid));
  const draw = () => {
    baseView(rid);
    for (const id of reg.items) {
      view.forceLabel.add(id);
      if (ans[id]) { view.cls[id] = "ans"; view.labelText[id] = ITEM[ans[id]].name; view.labelCls[id] = "ansl"; }
      else { view.labelText[id] = "？"; view.labelCls[id] = "q"; }
    }
    if (sel) view.cls[sel] = "sel";
    render();
    const used = new Set(Object.values(ans));
    const filled = reg.items.filter(i => ans[i]).length;
    panel.innerHTML = `<div class="feedback">${sel ? "選んだ県（青）の名前をタップ" : "まず地図で県をタップ"}　<span class="muted">記入 ${filled}/${reg.items.length}</span></div>
      <div class="chips">${shuffleStable(reg.items).map(n => `<button class="chip ${used.has(n) ? "used" : ""}" data-n="${n}" ${sel ? "" : "disabled"}>${esc(ITEM[n].name)}</button>`).join("")}${sel && ans[sel] ? `<button class="chip" data-clear="1">消す</button>` : ""}</div>
      <div class="row"><button class="btn primary" id="gradeBtn">採点する</button></div>`;
    panel.querySelectorAll("[data-n]").forEach(b => b.onclick = () => {
      const n = b.dataset.n;
      for (const k of Object.keys(ans)) if (ans[k] === n) delete ans[k];
      ans[sel] = n; sel = null; draw();
    });
    const cl = panel.querySelector("[data-clear]"); if (cl) cl.onclick = () => { delete ans[sel]; sel = null; draw(); };
    $("#gradeBtn").onclick = () => {
      const left = reg.items.length - reg.items.filter(i => ans[i]).length;
      if (left) modal(`未記入が${left}県あります。このまま採点しますか？（未記入は未回答として記録します）`, [["戻る", "", null], ["採点する", "primary", () => grade(ans)]]);
      else grade(ans);
    };
  };
  onMapTap = (id, cx, cy) => { if (!reg.items.includes(id)) return; if (cx != null && tinyOnScreen(id)) { zoomAt(1 / 3, cx, cy); return; } sel = id; draw(); };
  draw();
}
let chipOrder = null;
function shuffleStable(items) { const key = items.join(","); if (!chipOrder || chipOrder.key !== key) chipOrder = { key, order: shuffle(items.slice()) }; return chipOrder.order; }
function grade(ans) {
  onMapTap = null;
  const reg = REGION[S.region];
  const res = { asked: 0, correct: 0, wrong: 0, unanswered: 0 };
  const wrongIds = [];
  baseView(S.region);
  for (const id of reg.items) {
    const a = ans[id]; const kind = !a ? "unanswered" : a === id ? "correct" : "wrong";
    res.asked++; res[kind]++; S.counts.test.asked++; S.counts.test[kind]++; bumpStat(id, kind);
    view.forceLabel.add(id);
    view.cls[id] = kind === "correct" ? "ok" : kind === "wrong" ? "ng" : "na";
    view.labelCls[id] = kind === "correct" ? "okl" : "ngl";
    view.labelText[id] = kind === "wrong" ? `${ITEM[id].name}（×${ITEM[a].name}）` : ITEM[id].name;
    if (kind !== "correct") wrongIds.push(id);
    view.lm.add(id);
  }
  render();
  const pass = res.correct === res.asked;
  if (pass) REC.passed[S.region] = { date: today(), how: "test" };
  const snap = JSON.parse(JSON.stringify(S.counts));
  REC.sessions.push({ date: today(), region: S.region, status: pass ? "pass" : "fail", round: S.testRound,
    check: snap.check, locate: snap.locate, spot: snap.spot, review: snap.review, test: res });
  if (REC.sessions.length > 200) REC.sessions = REC.sessions.slice(-200);
  save();
  for (const k of Object.keys(S.counts)) S.counts[k] = zc(); // 再テストの回は、その回の分だけを記録する
  setStatus(`<span class="tag">${esc(reg.name)}</span><span>白地図テストの結果</span>`);
  setPrompt(pass ? `合格です<span class="small">${esc(reg.name)}を合格として記録しました</span>` : `不合格<span class="small">赤が間違い、点線が未記入です。地図に正しい県名を出しています</span>`);
  const sumRows = [["check", "確認問題"], ["locate", "位置問題"], ["spot", "抜き打ち"], ["review", "復習の再出題"]].filter(([k]) => snap[k].asked)
    .map(([k, n]) => `<tr><td>${n}</td><td class="n">${snap[k].asked}</td><td class="n">${snap[k].correct}</td><td class="n">${snap[k].wrong}</td><td class="n">${snap[k].unanswered}</td></tr>`).join("");
  const nr = nextRegion();
  panel.innerHTML = `<table class="mini result-table"><tr><th></th><th class="n">出題</th><th class="n">正解</th><th class="n">不正解</th><th class="n">未回答</th></tr>
     ${sumRows}<tr><td><b>白地図テスト</b></td><td class="n">${res.asked}</td><td class="n">${res.correct}</td><td class="n">${res.wrong}</td><td class="n">${res.unanswered}</td></tr></table>
     ${wrongIds.length ? `<p class="jp">間違えた県：${wrongIds.map(i => esc(ITEM[i].name) + (ans[i] ? `（${esc(ITEM[ans[i]].name)}と回答）` : "（未記入）")).join("、")}</p>` : ""}
     <div class="row">${pass ? (nr ? `<button class="btn primary" id="nextReg">次の地方（${esc(nr.name)}）へ</button>` : "") : `<button class="btn primary" id="retry">間違えた県を復習して再テスト</button>`}</div>
     <div class="row"><button class="btn" id="homeBtn">ホームに戻る</button></div>`;
  $("#homeBtn").onclick = showHome;
  if ($("#retry")) $("#retry").onclick = () => startReview(wrongIds, "test");
  if ($("#nextReg")) $("#nextReg").onclick = () => startRegion(nr.id);
  S.phase = "done";
  clearCurrent();
}
$("#quitBtn").onclick = () => modal("学習を中断してホームに戻りますか？（ここまでの解答は県ごとの記録に残ります）", [["続ける", "", null], ["中断する", "primary", () => {
  if (S && S.phase !== "done" && Object.values(S.counts).some(c => c.asked)) { REC.sessions.push(isDrill() ? { date: today(), mode: "drill", kind: S.kind, status: "quit", drill: S.counts.drill, review: S.counts.review } : { date: today(), region: S.region, status: "quit", check: S.counts.check, locate: S.counts.locate, spot: S.counts.spot, review: S.counts.review }); save(); }
  clearCurrent();
  showHome();
}]]);

/* ===== 全国モード（全国の地図・隣接県・今日の復習） ===== */
const daysSince = d => { if (!d) return 999; const t = new Date(d + "T00:00:00"); return Math.max(0, Math.round((Date.now() - t.getTime()) / 86400000)); };
const missRate = s => s && s.asked ? (s.wrong + s.unanswered) / s.asked : 0;
function weightedPick(ids, weightOf, n) {
  const pool = ids.slice(), w = pool.map(weightOf), out = [];
  while (out.length < n && pool.length) {
    const tot = w.reduce((a, b) => a + b, 0); let r = Math.random() * tot, i = 0;
    for (; i < w.length - 1; i++) { r -= w[i]; if (r <= 0) break; }
    out.push(pool[i]); pool.splice(i, 1); w.splice(i, 1);
  }
  return out;
}
// 間違いが多いほど、また最後に出てから日数がたつほど出やすくする
function reviewWeight(st) { return 1 + 4 * missRate(st) + Math.min(daysSince(st && st.last), 14) / 3.5 + (st && st.asked ? 0 : 2); }
let ALL_IDS = [], ADJ_IDS = [];
function buildDrill(kind) {
  if (kind === "national47") return shuffle(ALL_IDS.slice()).map(id => ({ id, type: "locate" }));
  if (kind === "national10") return shuffle(ALL_IDS.slice()).slice(0, 10).map((id, i) => ({ id, type: i % 2 ? "check" : "locate" }));
  if (kind === "adjacent") return weightedPick(ADJ_IDS, id => reviewWeight(REC.adjStats[id]), 10).map(id => ({ id, type: "adj" }));
  // 今日の復習：位置問題7問＋確認問題3問
  return weightedPick(ALL_IDS, id => reviewWeight(REC.stats[id]), 10).map((id, i) => ({ id, type: i < 7 ? "locate" : "check" }));
}
function startDrill(kind) {
  S = { mode: "drill", kind, title: DRILL_KINDS[kind].title, region: null, phase: "drill", queue: buildDrill(kind), idx: 0,
        missed: [], missedAdj: [], counts: { drill: zc(), review: zc() }, answered: -1 };
  setMode("session");
  panel.innerHTML = "";
  fitTo(DATA_BOX, 0.02);
  nextQ();
}
function startDrillReview() {
  const items = S.missed.map(id => ({ id, type: "reviewcard", tries: 0 })).concat(S.missedAdj.map(id => ({ id, type: "reviewcard", kind: "adj", tries: 0 })));
  S.phase = "review"; S.idx = 0; S.stillWrong = new Set(S.missed.concat(S.missedAdj));
  S.queue = items;
  if (!items.length) return finishDrill();
  interstitial("間違えた県の復習", `${items.length}問分を復習します。隣の県と目印を見てから、もう一度答えます。`, nextQ);
}
/* 隣接県クイズ：オレンジの県と陸で接する県をすべてタップ */
function adjOptional(a, b) { return !!DS.neighborNotes[[a, b].sort().join("-")]; }
function askAdj(q) {
  const it = ITEM[q.id];
  nationalView();
  view.cls[q.id] = "hl"; view.forceLabel.add(q.id);
  render();
  fitTo(boxAround(q.id, U.boxMin), 0);
  setPrompt(`「${esc(it.name)}」と陸で接する県をすべてタップ<span class="small">もう一度タップすると選択を外せます。選び終えたら「採点する」</span>`);
  panel.innerHTML = `<div class="feedback" id="fb">選択中 0県</div>
   <div class="row"><button class="btn ghost" id="skipBtn">わからない</button><button class="btn blue" id="ansBtn">採点する</button><button class="btn primary hidden" id="nextBtn">次へ</button></div>`;
  const sel = new Set(); let done = false;
  onMapTap = id => {
    if (done || id === q.id) return;
    if (sel.has(id)) { sel.delete(id); delete view.cls[id]; } else { sel.add(id); view.cls[id] = "sel"; }
    render(); $("#fb").textContent = `選択中 ${sel.size}県`;
  };
  const phaseKey = S.phase === "review" ? "review" : "drill";
  const finish = skipped => {
    done = true; onMapTap = null;
    const need = it.nb.filter(n => !adjOptional(q.id, n));
    const missedN = need.filter(n => !sel.has(n));
    const extra = [...sel].filter(n => !it.nb.includes(n));
    const kind = skipped || (!sel.size && need.length) ? "unanswered" : (!missedN.length && !extra.length ? "correct" : "wrong");
    const c = S.counts[phaseKey]; c.asked++; c[kind]++; bumpAdj(q.id, kind); S.answered = S.idx; save();
    view.cls = {}; view.cls[q.id] = "hl";
    for (const n of it.nb) { view.forceLabel.add(n); if (sel.has(n)) { view.cls[n] = "ok"; view.labelCls[n] = "okl"; } else { view.cls[n] = "nb"; } }
    for (const n of extra) { view.cls[n] = "ng"; view.forceLabel.add(n); view.labelCls[n] = "ngl"; }
    view.lm.add(q.id);
    render();
    fitTo(boundsOf([q.id].concat(it.nb, extra), !!insetOf(q.id)), 0.12);
    const parts = [];
    if (missedN.length) parts.push(`足りない：${missedN.map(n => ITEM[n].name).join("、")}（黄色）`);
    if (extra.length) parts.push(`接していない：${extra.map(n => ITEM[n].name).join("、")}（赤）`);
    const opt = it.nb.filter(n => adjOptional(q.id, n)).map(n => `${ITEM[n].name}は${DS.neighborNotes[[q.id, n].sort().join("-")]}ため、選んでも選ばなくても正解にしています`);
    $("#fb").innerHTML = (kind === "correct" ? `<span class="ok">正解</span>　` : `<span class="ng">${kind === "wrong" ? "不正解" : "未回答"}</span>　`) +
      `<span class="jp">${esc(neighborText(it))}</span>` + (parts.length ? `<br><span class="jp">${esc(parts.join("／"))}</span>` : "") + (opt.length ? `<br><span class="muted jp">${esc(opt.join("。"))}</span>` : "");
    $("#ansBtn").classList.add("hidden"); $("#skipBtn").classList.add("hidden");
    if (S.phase === "review") {
      if (kind !== "correct") { const tries = (q.tries || 0) + 1; if (tries < 3) S.queue.push({ id: q.id, type: "reviewcard", kind: "adj", tries }); else S.stillWrong.add(q.id); }
      else S.stillWrong.delete(q.id);
    } else if (kind !== "correct" && !S.missedAdj.includes(q.id)) S.missedAdj.push(q.id);
    saveCurrent();
    const nb = $("#nextBtn"); nb.classList.remove("hidden"); nb.onclick = advance;
    statusLine();
  };
  $("#ansBtn").onclick = () => finish(false);
  $("#skipBtn").onclick = () => finish(true);
}
function finishDrill() {
  onMapTap = null;
  const snap = JSON.parse(JSON.stringify(S.counts));
  REC.sessions.push({ date: today(), mode: "drill", kind: S.kind, status: "done", drill: snap.drill, review: snap.review });
  if (REC.sessions.length > 200) REC.sessions = REC.sessions.slice(-200);
  save();
  const wrong = [...new Set(S.missed.concat(S.missedAdj))];
  nationalView();
  for (const id of S.missed) { view.cls[id] = "ng"; view.forceLabel.add(id); view.labelCls[id] = "ngl"; }
  for (const id of S.missedAdj) { if (!view.cls[id]) { view.cls[id] = "nb"; view.forceLabel.add(id); } }
  render(); fitTo(DATA_BOX, 0.02);
  setStatus(`<span class="tag">${esc(S.title)}</span><span>結果</span>`);
  const d = snap.drill;
  setPrompt(`${d.correct}/${d.asked}問 正解<span class="small">${wrong.length ? "地図の赤が間違えた県です" : "全問正解でした"}</span>`);
  const row = (n, c) => `<tr><td>${n}</td><td class="n">${c.asked}</td><td class="n">${c.correct}</td><td class="n">${c.wrong}</td><td class="n">${c.unanswered}</td></tr>`;
  panel.innerHTML = `<table class="mini result-table"><tr><th></th><th class="n">出題</th><th class="n">正解</th><th class="n">不正解</th><th class="n">未回答</th></tr>
    ${row("出題", d)}${snap.review.asked ? row("復習の再出題", snap.review) : ""}</table>
    ${S.missed.length ? `<p class="jp">位置を間違えた県：${S.missed.map(i => esc(ITEM[i].name)).join("、")}</p>` : ""}
    ${S.missedAdj.length ? `<p class="jp">隣接県を間違えた県：${S.missedAdj.map(i => esc(ITEM[i].name)).join("、")}</p>` : ""}
    <div class="row"><button class="btn primary" id="againDrill">もう一度（${esc(S.title)}）</button></div>
    <div class="row"><button class="btn" id="homeBtn">ホームに戻る</button></div>`;
  const kind = S.kind;
  $("#againDrill").onclick = () => startDrill(kind);
  $("#homeBtn").onclick = showHome;
  S.phase = "done";
  clearCurrent();
}

/* ===== 出典 ===== */
function renderFooter() {
  $("#footer").innerHTML = `<p class="jp"><b>地図の出典</b>：${esc(DS.source.text)}</p><p class="jp">${esc(DS.source.detail)}</p><p>${DS.source.links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join("　")}</p>` +
    (DS.id === "japan" ? `<p class="jp">隣接関係は、このデータで県境の線を共有しているかどうかから求めています（岡山県と香川県は瀬戸内海の井島で接しています）。</p>` : `<p class="jp">隣接関係は、このデータで国境の線を共有しているかどうかから求めています。飛び地や海外領土での接触（スペインとモロッコなど）は含まれないことがあります。</p>`);
}

/* ===== モード（日本・世界）の切り替え ===== */
const MODE_KEY = "chizu-anki:mode";
function loadDataset(id) {
  DS = DATASETS[id] || DATASETS.japan; U = CFG[DS.id];
  ITEM = Object.fromEntries(DS.items.map(i => [i.id, i]));
  REGION = Object.fromEntries(DS.regions.map(r => [r.id, r]));
  DEFAULT_PASSED = U.defaultPassed;
  DRILL_KINDS = drillKinds();
  KEY = "chizu-anki:" + DS.id + ":v1"; CUR_KEY = KEY + ":current";
  REC = loadRecord();
  // 2026-11-16：日本は全地方合格済みとして記録する（端末ごとの記録にも一度だけ反映）
  if (DS.id === "japan" && !REC.allPassed20261116) {
    for (const r of DS.regions) if (!REC.passed[r.id]) REC.passed[r.id] = { date: "2026-11-15", how: "manual" };
    REC.allPassed20261116 = true; save();
  }
  ALL_IDS = DS.items.map(i => i.id); ADJ_IDS = DS.items.filter(i => i.nb.length).map(i => i.id);
  DATA_BOX = [0, 0, DS.W, DS.H];
  buildMap();
  $("#title").textContent = U.title; document.title = U.title;
  $("#credit").textContent = DS.source.text;
  renderFooter();
  $("#dsTabs").innerHTML = Object.keys(DATASETS).map(k => `<button data-ds="${k}" class="${k === DS.id ? "on" : ""}">${CFG[k].tab}</button>`).join("");
  $("#dsTabs").querySelectorAll("[data-ds]").forEach(b => b.onclick = () => { if (b.dataset.ds !== DS.id) { loadDataset(b.dataset.ds); showHome(); } });
  try { localStorage.setItem(MODE_KEY, DS.id); } catch (e) {}
}
/* 世界モードでは、画面の文言の「都道府県」「県」「地方」「全国」を「国・地域」「国」「地域」「全世界」に読み替える
   （国名・地域名にはこれらの語が含まれないので、文言だけが置き換わる） */
const WORLD_WORDS = [[/都道府県/g, "国・地域"], [/県名/g, "国名"], [/県/g, "国"], [/地方/g, "地域"], [/全国/g, "全世界"]];
function localizeNode(root) {
  if (!DS || DS.id === "japan") return;
  const walk = n => {
    if (n.nodeType === 3) { let v = n.nodeValue, o = v; for (const [re, to] of WORLD_WORDS) v = v.replace(re, to); if (v !== o) n.nodeValue = v; return; }
    if (n.nodeType !== 1 || n.namespaceURI === NS) return;
    for (const c of n.childNodes) walk(c);
  };
  walk(root);
}
new MutationObserver(ms => { for (const m of ms) { if (m.type === "characterData") localizeNode(m.target); else m.addedNodes.forEach(localizeNode); } })
  .observe(document.body, { childList: true, subtree: true, characterData: true });

/* ===== 起動 ===== */
let startMode = "japan"; try { startMode = localStorage.getItem(MODE_KEY) || "japan"; } catch (e) {}
loadDataset(startMode);
showHome();
try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(n => { dlNS = n; if (n && $("#dlBtn")) $("#dlBtn").classList.remove("hidden"); }).catch(() => {}); } catch (e) {}
window.__app = { get S() { return S; }, get REC() { return REC; }, get ITEM() { return ITEM; }, get REGION() { return REGION; }, fitTo, regionBox, cam: () => cam };
</script>
